name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "develop"]

jobs:
  build-and-validate:
    name: Build and Validate (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ./todo-api.slnx

      - name: Build
        run: dotnet build ./todo-api.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ./todo-api.slnx --configuration Release --no-build --verbosity normal

      - name: Publish artifact
        run: dotnet publish ./Todo.Api/Todo.Api.csproj --configuration Release --no-build --output ./artifacts/publish

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: todo-api-publish
          path: ./artifacts/publish
          if-no-files-found: error
